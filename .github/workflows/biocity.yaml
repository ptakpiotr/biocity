name: BioCity App CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  buildLintAndTest:
    name: Build & Test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: vp install

      - name: Build
        run: vp build --base="${{ steps.pages.outputs.base_path }}/"

      - name: Lint
        run: vp lint

      - name: Test
        run: vp test

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/master'
    needs: buildLintAndTest
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
