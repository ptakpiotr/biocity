name: BioCity App CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - "*.md"

jobs:
  buildLintAndTest:
    name: Build & Test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: vp install

      - name: Build
        run: vp build

      - name: Lint
        run: vp lint

      - name: Test
        run: vp test

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/master'
    needs: buildLintAndTest
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
